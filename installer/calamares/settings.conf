# Calamares Configuration for Exu Linux
# This is the main settings file

branding: exu

entropy: 160

pythonjobs: 1

instances:
  - id: root
    weight: 80
    critical: true

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localtime
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - grubcfg
    - bootloader
    - umount
  - show:
    - finished

branding:
  distribution: Exu Linux
  distroVersionDescription: Version 1.0
  distroId: exulinux
  logo: "/usr/share/pixmaps/exulinux-logo.png"
  logoTextColor: "#6C5CE7"
  color: "#2D3436"
  colorBackground: "#F5F6FA"
